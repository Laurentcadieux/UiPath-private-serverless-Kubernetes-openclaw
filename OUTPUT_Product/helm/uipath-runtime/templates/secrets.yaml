{{- if .Values.auth.clientId }}
apiVersion: v1
kind: Secret
metadata:
  name: uipath-config
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: uipath-runtime
    app.kubernetes.io/part-of: uipath-private-serverless
type: Opaque
stringData:
  orchestrator-url: {{ .Values.orchestrator.url | quote }}
  orchestrator-tenant: {{ .Values.orchestrator.tenant | quote }}
  {{- if .Values.orchestrator.folderId }}
  folder-id: {{ .Values.orchestrator.folderId | quote }}
  {{- end }}
  client-id: {{ .Values.auth.clientId | quote }}
  client-secret: {{ .Values.auth.clientSecret | quote }}
{{- end }}

---
apiVersion: v1
kind: Secret
metadata:
  name: uipath-machine-keys
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: uipath-runtime
    app.kubernetes.io/part-of: uipath-private-serverless
type: Opaque
stringData:
{{- range $name, $key := .Values.machineTemplates }}
  {{ $name }}: {{ $key | quote }}
{{- end }}
