apiVersion: v1
kind: Secret
metadata:
  name: uipath-machine-keys
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: uipath-runtime
    app.kubernetes.io/part-of: uipath-private-serverless
type: Opaque
stringData:
{{- range $name, $key := .Values.machineTemplates }}
  {{ $name }}: {{ $key | quote }}
{{- end }}
