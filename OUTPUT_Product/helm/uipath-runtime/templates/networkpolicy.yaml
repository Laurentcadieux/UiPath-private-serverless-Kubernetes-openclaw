{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: uipath-robot-egress
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: uipath-runtime
    app.kubernetes.io/part-of: uipath-private-serverless
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: uipath-robot
  policyTypes:
  - Egress
  egress:
  # Allow DNS
  - to:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Allow HTTPS to Orchestrator
  - to:
    - ipBlock:
        cidr: {{ .Values.networkPolicy.orchestratorCidr | quote }}
    ports:
    - protocol: TCP
      port: 443
{{- end }}
