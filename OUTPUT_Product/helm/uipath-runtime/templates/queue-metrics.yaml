apiVersion: apps/v1
kind: Deployment
metadata:
  name: uipath-queue-metrics
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: uipath-queue-metrics
    app.kubernetes.io/part-of: uipath-private-serverless
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  replicas: {{ .Values.queueMetrics.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: uipath-queue-metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: uipath-queue-metrics
    spec:
      serviceAccountName: uipath-queue-metrics
      containers:
      - name: metrics
        image: {{ .Values.queueMetrics.image | quote }}
        imagePullPolicy: {{ .Values.queueMetrics.pullPolicy }}
        ports:
        - containerPort: {{ .Values.queueMetrics.port }}
        env:
        - name: UIPATH_FOLDER_PATH
          value: {{ .Values.folderPath | quote }}
        - name: UIPATH_QUEUE_NAME
          value: {{ .Values.keda.queueName | default .Values.robot.defaultQueueName | quote }}
        - name: PORT
          value: {{ .Values.queueMetrics.port | quote }}
        - name: POLL_INTERVAL
          value: {{ .Values.queueMetrics.pollInterval | quote }}
        - name: UIP_CLI
          value: "/usr/local/bin/uip"
        resources:
          {{- toYaml .Values.queueMetrics.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /health
            port: {{ .Values.queueMetrics.port }}
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: {{ .Values.queueMetrics.port }}
          initialDelaySeconds: 3
          periodSeconds: 5
        {{- if .Values.queueMetrics.uipCredentials.enabled }}
        volumeMounts:
        - name: uip-credentials
          mountPath: /home/uipath/.uipath
          readOnly: true
        {{- end }}
      {{- if .Values.queueMetrics.uipCredentials.enabled }}
      volumes:
      - name: uip-credentials
        {{- if .Values.queueMetrics.uipCredentials.existingSecret }}
        secret:
          secretName: {{ .Values.queueMetrics.uipCredentials.existingSecret | quote }}
        {{- else if .Values.queueMetrics.uipCredentials.hostPath }}
        hostPath:
          path: {{ .Values.queueMetrics.uipCredentials.hostPath | quote }}
          type: DirectoryOrCreate
        {{- else }}
        emptyDir: {}
        {{- end }}
      {{- end }}

---
apiVersion: v1
kind: Service
metadata:
  name: uipath-queue-metrics
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: uipath-queue-metrics
spec:
  selector:
    app.kubernetes.io/name: uipath-queue-metrics
  ports:
  - port: {{ .Values.queueMetrics.port }}
    targetPort: {{ .Values.queueMetrics.port }}
