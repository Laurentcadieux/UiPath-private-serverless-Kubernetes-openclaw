apiVersion: apps/v1
kind: Deployment
metadata:
  name: uipath-queue-metrics
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: uipath-queue-metrics
    app.kubernetes.io/part-of: uipath-private-serverless
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  replicas: {{ .Values.queueMetrics.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: uipath-queue-metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: uipath-queue-metrics
    spec:
      serviceAccountName: uipath-queue-metrics
      containers:
      - name: metrics
        image: {{ .Values.queueMetrics.image | quote }}
        imagePullPolicy: {{ .Values.queueMetrics.pullPolicy }}
        ports:
        - containerPort: {{ .Values.queueMetrics.port }}
        env:
        - name: UIPATH_ORCHESTRATOR_URL
          valueFrom:
            secretKeyRef:
              name: uipath-config
              key: orchestrator-url
        - name: UIPATH_TENANT
          valueFrom:
            secretKeyRef:
              name: uipath-config
              key: orchestrator-tenant
        - name: UIPATH_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: uipath-config
              key: client-id
        - name: UIPATH_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: uipath-config
              key: client-secret
        - name: PORT
          value: {{ .Values.queueMetrics.port | quote }}
        - name: POLL_INTERVAL
          value: {{ .Values.queueMetrics.pollInterval | quote }}
        resources:
          {{- toYaml .Values.queueMetrics.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /health
            port: {{ .Values.queueMetrics.port }}
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: {{ .Values.queueMetrics.port }}
          initialDelaySeconds: 3
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: uipath-queue-metrics
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: uipath-queue-metrics
spec:
  selector:
    app.kubernetes.io/name: uipath-queue-metrics
  ports:
  - port: {{ .Values.queueMetrics.port }}
    targetPort: {{ .Values.queueMetrics.port }}
