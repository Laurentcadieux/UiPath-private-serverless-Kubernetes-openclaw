apiVersion: v1
kind: Namespace
metadata:
  name: uipath-runtime
  labels:
    app.kubernetes.io/name: uipath-runtime
    app.kubernetes.io/part-of: uipath-private-serverless

---
# Orchestrator connection config
apiVersion: v1
kind: Secret
metadata:
  name: uipath-config
  namespace: uipath-runtime
type: Opaque
stringData:
  orchestrator-url: "https://cloud.uipath.com"  # Replace with your Orchestrator URL
  orchestrator-tenant: "default"                 # Replace with your tenant
  # folder-id: ""                                # Optional: specific folder

---
# Machine keys (one per machine template)
apiVersion: v1
kind: Secret
metadata:
  name: uipath-machine-keys
  namespace: uipath-runtime
type: Opaque
stringData:
  # machine-template-name: "your-machine-key-here"
  # Add one entry per machine template you want to use
  # Example:
  # default-template: "abc123def456..."
